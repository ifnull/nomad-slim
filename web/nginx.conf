worker_processes auto;
events { worker_connections 1024; }

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  types {
    application/vnd.pmtiles pmtiles;
  }

  # Browsers require a secure context (HTTPS) to grant geolocation, so the
  # maps page's "locate me" button only works when accessed over :8443.
  # Plain HTTP on :80 is kept so localhost/LAN access without CA install
  # still works for everything that doesn't need geolocation.
  server {
    listen 80 default_server;
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html;
    index index.html;

    # Captive portal detection — when the router redirects all client traffic
    # here, OSes probe these well-known URLs to decide whether to pop up the
    # "sign in to network" browser. Returning a 302 to / signals "captive
    # portal present" on every major platform, which is exactly the UX we
    # want: the device auto-opens the dashboard. Returning the expected
    # success body instead would suppress the popup and the user would never
    # see the landing page.
    #   iOS / macOS:  /hotspot-detect.html, /library/test/success.html
    #   Android:      /generate_204, /gen_204
    #   Windows:      /connecttest.txt, /ncsi.txt, /redirect
    #   Firefox:      /canonical.html, /success.txt
    location = /hotspot-detect.html         { return 302 /; }
    location = /library/test/success.html   { return 302 /; }
    location = /generate_204                { return 302 /; }
    location = /gen_204                     { return 302 /; }
    location = /connecttest.txt             { return 302 /; }
    location = /ncsi.txt                    { return 302 /; }
    location = /redirect                    { return 302 /; }
    location = /canonical.html              { return 302 /; }
    location = /success.txt                 { return 302 /; }

    # Always revalidate HTML so config/dashboard updates show up after
    # `docker compose up --build` without needing a hard reload — phones
    # (especially Chrome on iOS) cache HTML aggressively otherwise.
    location = / {
      add_header Cache-Control "no-cache, must-revalidate" always;
      expires off;
      try_files /index.html =404;
    }
    location ~* \.html$ {
      add_header Cache-Control "no-cache, must-revalidate" always;
      expires off;
    }
    # Vendored JS/CSS (maplibre, pmtiles, OLC, MGRS) is pinned at build time
    # and baked into the image — safe to cache aggressively.
    location /vendor/ {
      add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    # JSON directory listing for /maps/ so the viewer can discover
    # .pmtiles files that the user drops into ./data/maps.
    location /maps/ {
      autoindex on;
      autoindex_format json;
      autoindex_exact_size on;
      add_header Cache-Control "no-cache" always;
    }

    # Serve .pmtiles with range-request support (nginx default) and a
    # long cache; MapLibre's PMTiles protocol makes many range requests.
    location ~* \.pmtiles$ {
      root /usr/share/nginx/html;
      add_header Cache-Control "public, max-age=86400";
      add_header Access-Control-Allow-Origin "*";
    }

    # Font glyph packs (PBF) + sprite sheets for labeled basemap rendering.
    # Populated by scripts/fetch-basemap-assets.sh.
    location /basemaps-assets/ {
      add_header Cache-Control "public, max-age=2592000";
      add_header Access-Control-Allow-Origin "*";
      try_files $uri =404;
    }

    # Make the root CA downloadable so phones can grab it to install.
    # Only present if scripts/generate-cert.sh has been run on the host.
    location = /ca.crt {
      alias /etc/nginx/certs/ca.crt;
      default_type application/x-x509-ca-cert;
      add_header Content-Disposition 'attachment; filename="nomad-slim-ca.crt"';
      try_files $uri =404;
    }
  }
}
